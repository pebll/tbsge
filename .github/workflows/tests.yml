name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-4.6-stable

      - name: Set up Godot (checksum-verified) + import
        run: tools/get_godot.sh

      - name: Run headless tests
        run: ./run_tests.sh
